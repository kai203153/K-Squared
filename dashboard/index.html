<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Align</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--line:#dfe4e7;--soft:#edf0f2;--text:#172230;--muted:#6d7983;--head:#132d37;--head-text:#c6d9dc;
--btn:#173d4a;--btn-text:#fff;--btn2:#eaf0f1;--btn2-text:#233e49;--code:#eef2f4;--warn-bg:#fff1e1;--warn:#935200;--high-bg:#fee6e7;--high:#a1212a;
--ok-bg:#e3f4ea;--ok:#1d6b3c;--quote:#f7f9fa}
@media (prefers-color-scheme:dark){:root{--bg:#0f171c;--panel:#16222a;--line:#2a3a44;--soft:#22313a;--text:#e3eaee;--muted:#93a3ad;--head:#0b1d24;
--head-text:#9fbcc2;--btn:#4f8d9e;--btn-text:#08161b;--btn2:#253740;--btn2-text:#d5e3e7;--code:#22313a;--warn-bg:#3a2a12;--warn:#f0b867;
--high-bg:#3d1c20;--high:#ff9aa2;--ok-bg:#163223;--ok:#86d6a5;--quote:#1b2a33}}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:var(--head);color:#fff;padding:22px 5%;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:22px}header .sub{color:var(--head-text);margin-top:6px;font-size:14px}
select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
main{max-width:1100px;margin:24px auto;padding:0 16px}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:18px;margin-bottom:18px;min-width:0}
h2{font-size:16px;margin:0 0 12px;display:flex;gap:8px;align-items:center}
.muted,small{color:var(--muted)}
.pill{background:var(--warn-bg);color:var(--warn);border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.high{background:var(--high-bg);color:var(--high)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.plain{background:var(--soft);color:var(--muted)}
.item{border-top:1px solid var(--soft);padding:12px 0}.item:first-of-type{border-top:0}
.quotes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}@media(max-width:520px){.quotes{grid-template-columns:1fr}}
blockquote{margin:0;background:var(--quote);border-left:3px solid var(--line);padding:8px 10px;border-radius:6px;overflow-wrap:anywhere}
blockquote small{display:block;margin-bottom:4px}
button{font:inherit;font-size:14px;background:var(--btn);color:var(--btn-text);border:0;border-radius:8px;padding:8px 11px;margin:6px 4px 0 0;cursor:pointer}
button.secondary{background:var(--btn2);color:var(--btn2-text)}
textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--text);margin-top:8px}
code{background:var(--code);padding:2px 5px;border-radius:4px}
.long{overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.draft{white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div><h1>ALIGN <span style="font-weight:400;font-size:16px">/ Early Commitment Monitor</span></h1>
  <div class="sub">Private to you · local only · nothing is sent to anyone</div></div>
  <label class="row" style="color:var(--head-text)">Task <select id="task"></select></label>
</header>
<main>
  <div class="panel" id="taskPanel">Loading…</div>
  <div class="layout">
    <section>
      <div class="panel"><h2>Findings <span id="count" class="pill plain">0</span></h2><div id="findings"></div></div>
      <div class="panel"><h2>Exposure model</h2>
        <p class="muted">Dependency-weighted hours at risk if the direction is reversed later. Illustrative and uncalibrated, not time saved.</p>
        <div id="work"></div></div>
    </section>
    <section>
      <div class="panel"><h2>Authorized records</h2><div id="records"></div></div>
      <div class="panel"><h2>Captured events</h2><div id="events"></div></div>
      <div class="panel"><h2>Commitments</h2><div id="commitments"></div></div>
    </section>
  </div>
</main>
<script>
const TOKEN = "__ALIGN_TOKEN__";
const esc = s => String(s ?? "").replace(/[&<>"']/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const $ = id => document.getElementById(id);
const api = (path, opts = {}) => fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-Align-Token": TOKEN}}).then(r => r.json());
const ago = t => { const s = Math.round(Date.now() / 1000 - t); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`; };
let task = null, last = "";
const notes = {};  // Keep typed notes across re-renders.

function findingHtml(f) {
  const cls = f.status === "open" ? "high" : f.status === "resolved" ? "ok" : "";
  const draft = (f.responses.find(r => r.draft) || {}).draft;
  const resp = f.responses.map(r => `<div><small>${esc(r.response)} · ${ago(r.created)}${r.note ? " · " + esc(r.note) : ""}</small></div>`).join("");
  return `<div class="item">
    <div class="row"><span class="pill ${cls}">${esc(f.severity)} · ${esc(f.status)}</span><span class="pill plain">${esc(f.detector)}</span><small>${esc(f.session)} · ${ago(f.created)}</small></div>
    <p><strong>Direction conflicts with confirmed <code>${esc(f.record_id)}</code></strong></p>
    <div class="quotes"><blockquote><small>You said</small>${esc(f.event_quote)}</blockquote><blockquote><small>${esc(f.record_id)} says</small>${esc(f.decision_quote)}</blockquote></div>
    <small>${esc(f.explanation)}</small>
    <p><strong>${f.impact_min.toFixed(1)}–${f.impact_max.toFixed(1)} h</strong> <span class="muted">future work exposure</span></p>
    ${resp}
    ${draft ? `<blockquote class="draft"><small>Clarification draft (copy and send yourself)</small>${esc(draft)}</blockquote><button class="secondary" data-copy="${esc(f.id)}">Copy draft</button>` : ""}
    ${f.status === "open" ? `<div>
      <button data-act="use_existing" data-id="${esc(f.id)}">Use existing decision</button>
      <button class="secondary" data-act="new_evidence" data-id="${esc(f.id)}">I have new evidence</button>
      <button class="secondary" data-act="ask_manager" data-id="${esc(f.id)}">Draft clarification</button>
      <button class="secondary" data-act="dismiss" data-id="${esc(f.id)}">Dismiss</button>
      <textarea rows="2" data-note="${esc(f.id)}" placeholder="Optional note (evidence, why dismissed)">${esc(notes[f.id] || "")}</textarea></div>` : ""}
  </div>`;
}

function render(s) {
  const t = s.tasks.find(x => x.id === s.task_id);
  $("task").innerHTML = s.tasks.map(x => `<option value="${esc(x.id)}" ${x.id === s.task_id ? "selected" : ""}>${esc(x.id)}</option>`).join("");
  $("taskPanel").innerHTML = t ? `<h2>Active task · ${esc(t.id)}</h2><strong>${esc(t.title)}</strong><p class="muted">${esc(t.goal)}</p>`
    : `<h2>No tasks</h2><p class="muted">Run <code>python3 -m align import &lt;dir&gt;</code> or <code>python3 -m align init --example de-104</code>.</p>`;
  const open = s.findings.filter(f => f.status === "open").length;
  $("count").textContent = `${open} open`; $("count").className = "pill " + (open ? "high" : "plain");
  $("findings").innerHTML = s.findings.length ? s.findings.map(findingHtml).join("") : `<p class="muted">No conflicts with confirmed records. Align stays silent.</p>`;
  $("records").innerHTML = s.records.length ? s.records.map(r => `<div class="item">
    <div class="row"><code>${esc(r.id)}</code><span class="pill ${r.authoritative ? "ok" : "plain"}">${esc(r.status)}${r.authoritative ? "" : " · not enforced"}</span>${r.dismissals ? `<small>${r.dismissals} dismissed</small>` : ""}</div>
    <div><strong>${esc(r.title)}</strong></div><div class="long muted">${esc(r.body)}</div><small>${esc(r.source)}</small></div>`).join("") : `<p class="muted">No records for this task.</p>`;
  $("events").innerHTML = s.events.length ? s.events.map(e => {
    const a = e.analysis || {}, label = e.status === "analyzed" ? (a.result || "analyzed") : e.status;
    return `<div class="item"><div class="row"><small>${esc(e.kind)} · ${esc(e.session)} · ${ago(e.created)}</small><span class="pill ${a.result === "conflict" ? "high" : "plain"}">${esc(label)}</span>${a.detector ? `<span class="pill plain">${esc(a.detector)}</span>` : ""}</div>
      <div class="long">${esc(e.content.slice(0, 400))}</div></div>`;
  }).join("") : `<p class="muted">No events yet. Send a prompt from a repo with Align hooks installed.</p>`;
  $("commitments").innerHTML = s.commitments.length ? s.commitments.map(c => `<div class="item"><strong>${esc(c.statement)}</strong><div><small>${esc(c.stage)} · ${esc(c.session)} · ${esc(c.detector)}</small></div></div>`).join("") : `<p class="muted">No recorded commitments.</p>`;
  $("work").innerHTML = s.work.map(w => `<div class="item">${esc(w.description)} <small>(${w.hours}h × ${w.dependency} dependency × ${w.invalidation} invalidation)</small></div>`).join("")
    + `<p><strong>${s.exposure[0].toFixed(1)}–${s.exposure[1].toFixed(1)} h</strong> <span class="muted">total exposure</span></p>`;
}

async function refresh() {
  try {
    const s = await api("/api/state" + (task ? "?task=" + encodeURIComponent(task) : ""));
    task = s.task_id;
    const key = JSON.stringify(s);
    if (key !== last && !document.activeElement?.dataset?.note) { last = key; render(s); }
  } catch (e) { $("events").textContent = "Backend unavailable."; }
}

document.addEventListener("input", e => { if (e.target.dataset.note) notes[e.target.dataset.note] = e.target.value; });
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act) {
    await api("/api/respond", {method: "POST", body: JSON.stringify({finding_id: b.dataset.id, response: b.dataset.act, note: notes[b.dataset.id] || ""})});
    delete notes[b.dataset.id]; last = ""; refresh();
  } else if (b.dataset.copy) {
    const q = b.previousElementSibling.cloneNode(true); q.querySelector("small").remove();
    try { await navigator.clipboard.writeText(q.textContent.trim()); b.textContent = "Copied"; } catch { b.textContent = "Copy failed"; }
  }
});
$("task").addEventListener("change", e => { task = e.target.value; last = ""; refresh(); });
setInterval(refresh, 1000); refresh();
</script>
</body>
</html>
